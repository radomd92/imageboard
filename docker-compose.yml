services:
  app:
    build:
      context: .
      dockerfile: go_api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      IMAGEBOARD_MEDIA_ROOT: /srv/media
    volumes:
      - ${IMAGEBOARD_MEDIA_ROOT:?set IMAGEBOARD_MEDIA_ROOT}:/srv/media:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["8000"]

  migrator:
    build: ./imageboard
    restart: "no"
    env_file: .env
    entrypoint: ["alembic"]
    command: ["-c", "migrations/alembic.ini", "upgrade", "head"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  index-worker:
    build: ./index_worker
    restart: unless-stopped
    env_file: .env
    environment:
      IMAGEBOARD_MEDIA_ROOT: /srv/media
      INDEX_BATCH_SIZE: 500
    volumes:
      - ${IMAGEBOARD_MEDIA_ROOT:?set IMAGEBOARD_MEDIA_ROOT}:/srv/media:ro
    depends_on:
      migrator:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  nginx:
    build: ./nginx_file_server
    restart: unless-stopped
    depends_on:
      - app
    environment:
      MEDIA_ROOT: /srv/media
    volumes:
      - ${IMAGEBOARD_MEDIA_ROOT:?set IMAGEBOARD_MEDIA_ROOT}:/srv/media:ro
      - ${IMAGEBOARD_TLS_CERT:?set IMAGEBOARD_TLS_CERT}:/run/secrets/tls.crt:ro
      - ${IMAGEBOARD_TLS_KEY:?set IMAGEBOARD_TLS_KEY}:/run/secrets/tls.key:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,noexec,nosuid,nodev
      - /var/lib/nginx:size=1m,noexec,nosuid,nodev
      - /var/run:size=1m,noexec,nosuid,nodev
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    ports:
      - "8443:8443"

  tor:
    build: ./tor
    restart: unless-stopped
    depends_on:
      - nginx
    network_mode: service:nginx
    volumes:
      - tor-data:/var/lib/tor
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/tor/imageboard/hostname"]
      interval: 30s
      timeout: 5s
      retries: 10

volumes:
  tor-data:

networks:
  default:
    external: true
    name: imageboard-backend
