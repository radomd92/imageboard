name: Security checks

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: imageboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: imageboard/requirements*.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check imageboard migrations
      - run: bandit -q -r imageboard -x imageboard/static
      - run: pip-audit -r requirements.txt
      - run: python -m compileall -q imageboard migrations

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull --tag imageboard:test imageboard

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [go_api, index_worker]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go test ./...
        working-directory: ${{ matrix.module }}
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.0
          working-directory: ${{ matrix.module }}
          args: --config ../.golangci.yml
