name: Security checks

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: imageboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: imageboard/requirements*.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: ruff check imageboard migrations
      - run: bandit -q -r imageboard -x imageboard/static
      - run: pip-audit -r requirements.txt
      - run: python -m compileall -q imageboard migrations

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull --tag imageboard:test imageboard

  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [go_api, index_worker]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: imageboard_test
          POSTGRES_USER: imageboard_test
          POSTGRES_PASSWORD: imageboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imageboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: actions/setup-python@v7
        if: matrix.module == 'go_api'
        with:
          python-version: "3.13"
      - run: python -m pip install --requirement imageboard/requirements.txt
        if: matrix.module == 'go_api'
      - run: alembic -c migrations/alembic.ini upgrade head
        if: matrix.module == 'go_api'
        working-directory: imageboard
        env:
          IMAGEBOARD_DATABASE_URL: postgresql+psycopg://imageboard_test:imageboard_test@127.0.0.1:5432/imageboard_test
      - run: go test -race ./...
        working-directory: ${{ matrix.module }}
        env:
          IMAGEBOARD_TEST_DATABASE_URL: postgresql://imageboard_test:imageboard_test@127.0.0.1:5432/imageboard_test
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.0
          working-directory: ${{ matrix.module }}
          args: --config ../.golangci.yml
