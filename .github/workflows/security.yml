name: Security checks

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: imageboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: imageboard/requirements*.txt
      - run: python -m pip install --requirement requirements-dev.txt
      - run: pytest -q
      - run: ruff check imageboard tests migrations
      - run: bandit -q -r imageboard -x imageboard/static
      - run: pip-audit -r requirements.txt
      - run: python -m compileall -q imageboard tests migrations

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull --tag imageboard:test imageboard
