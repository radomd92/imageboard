user www-data;
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    etag off;
    log_format confidential '$remote_addr [$time_local] "$request_method" $status $body_bytes_sent';
    access_log /dev/stdout confidential;
    error_log /dev/stderr crit;
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_req_zone $binary_remote_addr zone=media:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;

    server {
        listen 8443 ssl http2;
        server_name _;
        ssl_certificate /run/secrets/tls.crt;
        ssl_certificate_key /run/secrets/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_prefer_server_ciphers off;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; connect-src 'self'" always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        limit_req zone=media burst=40 nodelay;
        limit_conn connections 20;
        disable_symlinks on from=/srv/media;

        location = /_authorize {
            internal;
            proxy_pass http://app:8000/api/internal/authorize;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }

        location /media/ {
            auth_request /_authorize;
            alias /srv/media/;
            autoindex off;
            try_files $uri =404;
            limit_except GET HEAD { deny all; }
        }

        location /thumbnail/ {
            proxy_pass http://app:8000;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            limit_except GET HEAD { deny all; }
        }

        location /api/ {
            proxy_pass http://app:8000;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            limit_except GET POST PATCH PUT DELETE { deny all; }
        }

        location /static/ {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            limit_except GET HEAD { deny all; }
        }

        location = /health/live { proxy_pass http://app:8000; }
        location = /health/ready { proxy_pass http://app:8000; }

        location = / {
            proxy_pass http://app:8000;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / { return 404; }
    }

    include /etc/nginx/conf.d/*.conf;
}
