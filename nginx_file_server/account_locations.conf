# Only account endpoints may mutate through the onion server.
location = /api/me/password {
    include /etc/nginx/account_proxy.conf;
    limit_except PUT { deny all; }
}

location = /api/admin/users {
    include /etc/nginx/account_proxy.conf;
    limit_except GET POST { deny all; }
}

location ~ ^/api/admin/users/[1-9][0-9]*/password$ {
    include /etc/nginx/account_proxy.conf;
    limit_except PUT { deny all; }
}

location ~ ^/api/admin/users/[1-9][0-9]*$ {
    include /etc/nginx/account_proxy.conf;
    limit_except PATCH { deny all; }
}
