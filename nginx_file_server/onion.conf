server {
    listen 127.0.0.1:8080;
    server_name _;

    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; connect-src 'self'" always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header X-Imageboard-Media-Read-Only 1 always;
    limit_req zone=media burst=40 nodelay;
    limit_conn connections 20;
    disable_symlinks on from=/srv/media;

    location = /_onion_authorize {
        internal;
        proxy_pass http://app:8000/api/internal/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
    }

    location /media/ {
        auth_request /_onion_authorize;
        alias /srv/media/;
        autoindex off;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }

    location /thumbnail/ {
        proxy_pass http://app:8000;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Real-IP $remote_addr;
        limit_except GET HEAD { deny all; }
    }

    # This nominally-GET endpoint records a view, so exclude it from read-only access.
    location ~ ^/api/images/[0-9]+/file$ { return 403; }

    include /etc/nginx/account_locations.conf;

    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Real-IP $remote_addr;
        limit_except GET HEAD { deny all; }
    }

    location /static/ {
        auth_request /_onion_authorize;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        limit_except GET HEAD { deny all; }
    }

    location = / {
        proxy_pass http://app:8000;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / { return 404; }
}
