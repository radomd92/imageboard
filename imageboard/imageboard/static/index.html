<!doctype html>
<html lang="en" data-theme="rorisu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paradise Imageboard</title>
    <script src="/static/theme-boot.js"></script>
    <link rel="stylesheet" href="/static/app.css" />
    <link rel="stylesheet" href="/static/themes/rorisu.css" />
    <link rel="stylesheet" href="/static/themes/macos.css" />
    <link rel="stylesheet" href="/static/themes/win98.css" />
  </head>
  <body>
    <div class="menubar">
      <strong class="apple">◆</strong><strong>Paradise</strong> <span>File</span
      ><span>Edit</span><span>View</span><span>Go</span>
      <span id="clock"></span>
    </div>
    <main class="desktop">
      <section class="window app-window">
        <header class="titlebar">
          <i></i>
          <h1>Paradise Imageboard</h1>
          <i></i>
        </header>
        <div class="app-body">
          <aside class="sidebar">
            <div class="brand">
              <span class="brand-mark">P</span>
              <div><strong>PARADISE</strong><small>MEDIA CATALOG</small></div>
            </div>
            <nav id="navigation">
              <button data-view="home" class="active">
                <span>⌂</span>Dashboard
              </button>
              <button data-view="library"><span>▦</span>Library</button>
              <button data-view="tags"><span>◇</span>Tags</button>
              <button data-view="untagged"><span>□</span>Needs Tags</button>
              <button data-view="favorites"><span>★</span>Favorites</button>
              <button data-view="explorer" class="admin-only">
                <span>▣</span>Media Explorer
              </button>
            </nav>
            <div class="theme-card">
              <span>APPEARANCE</span>
              <div
                class="theme-options"
                role="radiogroup"
                aria-label="Appearance"
              >
                <button type="button" data-theme-choice="rorisu">Rorisu</button>
                <button type="button" data-theme-choice="macos">macOS</button>
                <button type="button" data-theme-choice="win98">Win98</button>
                <button type="button" data-theme-choice="classic">
                  Classic
                </button>
              </div>
            </div>
            <div class="user-panel">
              <span class="user-icon">●</span>
              <div>
                <strong id="username">Loading</strong
                ><small id="role">USER</small>
              </div>
            </div>
          </aside>
          <section class="workspace">
            <div class="toolbar">
              <div class="history">
                <button id="back" title="Back">‹</button
                ><button id="forward" title="Forward">›</button>
              </div>
              <div class="path" id="path">Paradise HD : Dashboard</div>
              <div class="search">
                <span>⌕</span>
                <input id="search" type="search" placeholder="Search library" aria-label="Search library" />
                <button class="search-help" type="button" data-search-help aria-label="Search syntax help" title="Search syntax help">?</button>
              </div>
            </div>
            <div id="notice" role="status"></div>
            <section id="view" class="view"></section>
            <footer class="statusbar">
              <span id="status">Connecting…</span><span class="resize">◢</span>
            </footer>
          </section>
        </div>
      </section>
    </main>

    <dialog id="inspector" class="window modal">
      <header class="titlebar">
        <button class="close-box" data-close="inspector">×</button>
        <h2 id="inspector-title">Media Inspector</h2>
        <i></i>
      </header>
      <div id="inspector-body" class="modal-body"></div>
    </dialog>

    <dialog id="document-reader" class="window modal">
      <header class="titlebar">
        <button class="close-box" data-close="document-reader">×</button>
        <h2 id="document-reader-title">Document Reader</h2>
        <i></i>
      </header>
      <pre id="document-reader-content" class="document-content"></pre>
    </dialog>

    <script src="/static/app.js"></script>
  </body>
</html>
