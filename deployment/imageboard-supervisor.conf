[program:imageboard]
directory=/home/rado/imageboard
command=/usr/bin/docker-compose --project-name imageboard up --build
user=root
autostart=true
autorestart=true
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/var/log/supervisor/imageboard.log
stderr_logfile=/var/log/supervisor/imageboard-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
